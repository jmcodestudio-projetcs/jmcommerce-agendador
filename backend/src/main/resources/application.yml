spring:
  application:
    name: jmcommerce-agendador
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendador}
    username: ${DB_USER:agendador}
    password: ${DB_PASSWORD:agendador}
  jpa:
    hibernate:
      ddl-auto: validate   # o Flyway e o unico dono do schema
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: 8080

app:
  jwt:
    # Em producao, definir JWT_SECRET com um valor aleatorio de pelo menos 32 caracteres.
    secret: ${JWT_SECRET:dev-apenas-troque-em-producao-0123456789abcdef}
    expiracao-dias: 7
